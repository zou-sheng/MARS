mapspace:
  constraints:
  - target: Registers
    type: datatype
    bypass:
    - Outputs
    - Inputs
    keep:
    - Weights
  - target: Accumulator
    type: datatype
    bypass:
    - Weights
    - Inputs
    keep:
    - Outputs
  - target: LocalBuffer
    type: datatype
    bypass:
    - Weights
    - Outputs
    keep:
    - Inputs
