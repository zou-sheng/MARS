architecture:
  version: 0.2

  subtree:
  - name: System

    local:
    - name: DRAM
      class: DRAM
      attributes:
        block_size: 64
        word_bits: 8
        read_bandwidth: 1
        write_bandwidth: 1
        cluster_size: 1

    subtree:
    - name: Chip
      attributes:
        technology: 40nm

      local:
      - name: GlobalBuffer
        class: SRAM
        attributes:
          block_size: 8
          depth: 8192
          width: 64
          word_bits: 8
          num_ports: 2
          num_banks: 256
          read_bandwidth: 2
          write_bandwidth: 2
          cluster_size: 1

      subtree:
      - name: PE[0..15]

        local:
        - name: InputBuffer
          class: regfile
          attributes:
            block_size: 4
            depth: 2048
            width: 32
            word_bits: 8
            num_ports: 2
            num_banks: 1
            read_bandwidth: 2
            write_bandwidth: 2
            cluster_size: 1

        - name: WeightBuffer
          class: regfile
          attributes:
            block_size: 4
            depth: 8192
            width: 32
            word_bits: 8
#            meshX: 16
            num_ports: 1
            num_banks: 8
            read_bandwidth: 2
            write_bandwidth: 2
            cluster_size: 1

        - name: AccumulationBuffer
          class: regfile
          attributes:
            block_size: 4
            depth: 768
            width: 96
            word_bits: 24
#            meshX: 16
            network-word_bits: 16
            num_ports: 2
            num_banks: 2
            read_bandwidth: 2
            write_bandwidth: 2
            cluster_size: 1

        - name: Registers[0..63]
          class: regfile
          attributes:
            block_size: 1
            depth: 1
            width: 8
            word_bits: 8
#            meshX: 16
            num_ports: 2
            num_banks: 8
            read_bandwidth: 2
            write_bandwidth: 2
            cluster_size: 1

        - name: MACC[0..63]
          class: intmac
          attributes:
            word_bits: 8
#            meshX: 16
            cluster_size: 1