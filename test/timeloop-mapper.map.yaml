mapping:
  - target: Registers
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: AccumulationBuffer
    type: datatype
    keep:
      - Outputs
    bypass:
      - Weights
      - Inputs
  - target: WeightBuffer
    type: datatype
    keep:
      - Weights
    bypass:
      - Inputs
      - Outputs
  - target: InputBuffer
    type: datatype
    keep:
      - Inputs
    bypass:
      - Weights
      - Outputs
  - target: GlobalBuffer
    type: datatype
    keep:
      - Inputs
      - Outputs
    bypass:
      - Weights
  - target: DRAM
    type: datatype
    keep:
      - Weights
      - Inputs
      - Outputs
    bypass:
      []
  - target: Registers
    type: temporal
    factors: R1 S1 P1 Q3 C1 K1 N1
    permutation: QRSPCKN
  - target: AccumulationBuffer
    type: spatial
    factors: R5 S1 P2 Q2 C2 K1 N1
    permutation: RPQCSKN
    split: 4
  - target: AccumulationBuffer
    type: temporal
    factors: R1 S5 P2 Q1 C1 K6 N1
    permutation: SKPRQCN
  - target: WeightBuffer
    type: temporal
    factors: R1 S1 P3 Q1 C1 K1 N1
    permutation: PRSQCKN
  - target: InputBuffer
    type: temporal
    factors: R1 S1 P1 Q3 C2 K2 N1
    permutation: QKCRSPN
  - target: GlobalBuffer
    type: spatial
    factors: R1 S1 P1 Q2 C4 K1 N1
    permutation: QCRSPKN
    split: 2
  - target: GlobalBuffer
    type: temporal
    factors: R1 S1 P1 Q1 C4 K1 N1
    permutation: CRSPQKN
  - target: DRAM
    type: temporal
    factors: R1 S1 P3 Q1 C1 K16 N1
    permutation: KPRSQCN